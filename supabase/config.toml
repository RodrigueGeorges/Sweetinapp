[functions.send-flip]
verify_jwt = true

[functions.open-flip]
verify_jwt = true

[functions.scratched]
verify_jwt = true

[functions.report]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.cleanup]
verify_jwt = false

[functions.screenshot]
verify_jwt = true

[functions.set-avatar]
verify_jwt = true

[functions.sweet-hour]
verify_jwt = false

[functions.open-link]
verify_jwt = false

[functions.link-scratched]
verify_jwt = false

[functions.streak-reminder]
verify_jwt = false

[auth]
site_url = "sweetin://"
additional_redirect_urls = ["sweetin://auth-callback", "sweetin://google-auth"]

[auth.email]
enable_confirmations = true

# voie royale : OTP par SMS (Twilio déjà configuré côté projet hébergé ;
# activer « Phone » dans Authentication → Providers pour l'inscription/connexion)
[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_BUNDLE_ID)"
secret = "env(APPLE_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

[functions.waitlist]
verify_jwt = false

[functions.open-mine]
verify_jwt = true
