# Parcours de bout en bout sur un simulateur ou un téléphone : maestro test .maestro
# Variables : EMAIL (adresse neuve), PASSWORD, USERNAME (pseudo libre). Exemple :
#   maestro test -e EMAIL=test+1@sweetin.app -e PASSWORD=motdepasse123 -e USERNAME=test_1 .maestro/01_intro_et_inscription.yaml
appId: app.sweetin.ios
---
- clearState
- launchApp
- assertVisible: "Prends une photo|Take a photo"
- tapOn: "Suivant|Next"
- tapOn: "Suivant|Next"
- tapOn: "C’est parti|Let’s go"
- tapOn: "SIGNUP|INSCRIPTION|Signup|Inscription"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Mot de passe|Password"
- inputText: ${PASSWORD}
- tapOn: "VALIDER|Valider|CONTINUE|Continue"
# si la confirmation par email est active, confirmer puis se connecter avant de continuer
- runFlow:
    when:
      visible: "Pseudo|Username"
    commands:
      - tapOn: "Pseudo|Username"
      - inputText: ${USERNAME}
      - tapOn: "JJ|DD"
      - inputText: "15"
      - inputText: "06"
      - inputText: "1998"
      - tapOn: "Continuer|Continue"
      - assertVisible: "Envoyer un flip|Send a flip"
