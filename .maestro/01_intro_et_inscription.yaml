# Régression « écran noir » : au lancement l'app doit afficher la welcome Fondant,
# jamais l'écran de lecture sans id (FLAG_SECURE + shimmer infini).
# Expo Go : maestro test .maestro/01_intro_et_inscription.yaml
# Dev build natif : remplacer appId par app.sweetin.android et adapter _ouvrir.yaml.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- runFlow: _ouvrir.yaml
# la welcome Fondant : démo à gratter, stickers, promesse — aucun voile noir
- extendedWaitUntil:
    visible: "send my first sweet|envoyer mon premier sweet"
    timeout: 60000
- assertVisible: "scratch me|gratte-moi"
- assertVisible: "i’m melting|je fonds"
# le bouton « Fermer » de l'écran de lecture ne doit pas apparaître
- assertNotVisible: "Close|Fermer"
