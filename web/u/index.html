<script>
  // Page affichée quand l'app n'est pas installée, ou quand on arrive depuis une page sweetin.app
  // (les liens universels ne s'ouvrent pas dans l'app depuis le même domaine).
  var fr = /^fr\b/i.test(navigator.language || 'fr');
  var name = decodeURIComponent(location.pathname.split('/u/')[1] || '').split('/')[0].replace(/[^a-z0-9_.]/gi, '').toLowerCase();
  var src = (new URLSearchParams(location.search).get('src') || 'link').replace(/[^a-z]/g, '');
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua), android = /Android/.test(ua);
  var store = ios ? 'https://apps.apple.com/app/idAPP_STORE_ID'
            : android ? 'https://play.google.com/store/apps/details?id=app.sweetin.android&referrer=' + encodeURIComponent('invite=' + name + '&src=' + src)
            : 'https://sweetin.app';
  var $ = function (id) { return document.getElementById(id); };
  if (!fr) {
    document.documentElement.lang = 'en';
    $('msg').textContent = 'A friend wants you on Sweetin: a photo on the front, a secret behind it. You scratch to read it.';
    $('store').textContent = 'get sweetin';
    $('open').textContent = 'I already have the app';
  }
  if (name) {
    $('who').hidden = false; $('who').textContent = '@' + name;
    $('msg').textContent = fr ? 'veut te voir sur Sweetin. Une photo devant, un secret derrière : tu grattes pour le lire.' : 'wants you on Sweetin. A photo on the front, a secret behind it: you scratch to read it.';
    $('open').href = 'sweetin://u/' + encodeURIComponent(name) + '?src=' + src;
    $('hint').textContent = fr ? 'Après l’installation, touche « Coller » sur l’écran « ramène tes potes » pour ajouter @' + name + '.' : 'After installing, tap “Paste” on the “bring your people” screen to add @' + name + '.';
  }
  $('store').href = store;
  // le lien est copié pour être collé dans l'app après l'installation
  $('store').addEventListener('click', function () {
    try { if (name && navigator.clipboard) navigator.clipboard.writeText(location.origin + '/u/' + name + '?src=' + src); } catch (e) {}
  });
</script>
