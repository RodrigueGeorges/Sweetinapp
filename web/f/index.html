<style>
  /* DA Sweetin 2027 : cerise, cacao, vanille, pistache, holo ; logo vectoriel « sweetin. », Gabarito pour le reste */
  :root { --cerise:#FF2D5F; --cacao:#1A0A0E; --vanille:#FFF4E6; --pistache:#C5EE6A; --bubble:#FF8FB8;
    --holo: linear-gradient(115deg,#FFC8E4,#BDEBFF 30%,#FFF1A8 55%,#D5C6FF 80%,#FFC8E4); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; color: var(--cacao); overflow-x: hidden;
    background: linear-gradient(180deg, #FF4473, var(--cerise) 45%, #EB1650); background-attachment: fixed;
    font-family: 'Gabarito', system-ui, -apple-system, sans-serif; font-weight: 600; -webkit-user-select: none; user-select: none; }
  header { padding: max(18px, env(safe-area-inset-top)) 16px 4px; text-align: center; }
  .brand { font-size: 30px; color: var(--vanille); text-decoration: none; }
  main { flex: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 8px 20px 24px; }
  h1 { font-weight: 800; font-size: 42px; line-height: .95; letter-spacing: -1.2px; margin: 0; text-align: center; color: var(--vanille); text-transform: lowercase; }
  .sub { margin: 0; font-size: 16px; line-height: 1.45; text-align: center; max-width: 320px; font-weight: 700; }
  .card { position: relative; width: min(300px, calc(100vw - 72px)); background: var(--vanille); border-radius: 24px; padding: 7px 7px 0; border: 2.5px solid var(--cacao);
    box-shadow: 6px 6px 0 var(--cacao); transform: rotate(-2deg); transition: transform .5s cubic-bezier(.2,1.4,.4,1); }
  .card.live { transform: rotate(0); }
  .photo { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--holo); touch-action: none; }
  .photo img.preview { position: absolute; inset: -12%; width: 124%; height: 124%; object-fit: cover; filter: blur(14px) saturate(1.2); transform: scale(1.05); }
  .photo canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  .back { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
    background: rgba(255,244,230,.82); color: var(--cacao); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -.6px; word-break: break-word; }
  .backimg { position: absolute; inset: -12%; width: 124%; height: 124%; object-fit: cover; filter: blur(22px); }
  .msg { position: relative; transform: scale(.9); transition: transform .5s cubic-bezier(.2,1.6,.4,1); }
  .revealed .msg { transform: scale(1); }
  .strip { height: 50px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--cacao); }
  .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .lock span { background: var(--cacao); color: var(--vanille); font-weight: 800; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; padding: 9px 16px; border-radius: 14px; border: 2.5px solid var(--cacao); box-shadow: 4px 4px 0 var(--cerise); transform: rotate(-4deg); }
  .bar { width: calc(100% - 40px); max-width: 380px; margin: 0 auto calc(16px + env(safe-area-inset-bottom)); border: 2.5px solid var(--cacao); background: var(--vanille); color: var(--cacao); font-family: inherit; font-weight: 800; font-size: 19px;
    height: 58px; border-radius: 29px;  cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; text-transform: lowercase; transition: transform .1s, box-shadow .1s; }
  .bar:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--cacao); }
  .meta { display: inline-block; font-size: 15px; font-weight: 800; min-height: 18px; text-align: center; }
  .meta:not(:empty) { background: var(--pistache); border: 2px solid var(--cacao); border-radius: 999px; padding: 6px 14px; box-shadow: 3px 3px 0 var(--cacao); transform: rotate(-4deg); }
  .ghost { position: absolute; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.85); border: 8px solid rgba(255,255,255,.4);
    box-shadow: 0 0 14px #fff; pointer-events: none; animation: ghost 2.4s ease-in-out infinite; }
  @keyframes ghost { 0% { left: 18%; top: 22%; opacity: 0 } 10% { opacity: 1 } 30% { left: 62%; top: 32% } 55% { left: 22%; top: 50% } 80% { left: 60%; top: 64%; opacity: 1 } 100% { left: 34%; top: 70%; opacity: 0 } }
  .small { font-size: 12px; text-align: center; font-weight: 600; }
  .small a { color: var(--cacao); }
  .pill { display: inline-block; background: var(--vanille); padding: 10px 16px; border-radius: 22px; color: var(--cacao); text-decoration: none; font-family: inherit; font-weight: 800; font-size: 14px; border: 2px solid var(--cacao); cursor: pointer; }
  [hidden] { display: none !important; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  @media (prefers-reduced-motion: reduce) { .ghost { animation: none; display: none } .card, .msg { transition: none } }

<script>
(function () {
  'use strict';
  var API = (document.querySelector('meta[name="sweetin-api"]') || {}).content || '';
  var token = (location.pathname.split('/f/')[1] || '').split(/[/?#]/)[0];
  var fr = /^fr\b/i.test(navigator.language || 'fr');
  var T = fr ? {
    title: 'quelqu’un t’a caché un secret.', titleFrom: '@{n} t’a caché un secret.', sub: 'Gratte la photo avec ton doigt pour le lire.',
    open: 'gratter', once: 'Ça s’ouvre une seule fois. Prends ton temps.', onceMode: '1 seul passage : ne lève pas le doigt.',
    story: 'Secret posté en story, à gratter pendant 24 h.', loading: '…', scratch: 'gratte !', progress: '{p} % gratté',
    done: 'pouf. secret découvert.', replyT: 'Réponds à @{n} avec ton propre secret.', reply: 'répondre', get: 'télécharger sweetin',
    gone: 'déjà gratté.', goneSub: 'Sur Sweetin, un secret se lit une fois, puis il s’envole. Envoie le tien !',
    expired: 'trop tard.', expiredSub: 'Ce secret a expiré ou a déjà été effacé.', notfound: 'lien introuvable.', error: 'Oups, réessaie.',
    strip: 'un secret t’attend', from: 'de @{n}', report: 'Signaler ce contenu', rules: 'Conditions', privacy: 'Confidentialité', reveal: 'Révéler le message',
    lock: 'top secret', copied: 'Lien copié : colle-le dans l’app après l’installation.'
  } : {
    title: 'someone hid a secret for you.', titleFrom: '@{n} hid a secret for you.', sub: 'Scratch the photo with your finger to read it.',
    open: 'scratch', once: 'It only opens once. Take your time.', onceMode: 'One shot: don’t lift your finger.',
    story: 'Secret posted to a story, scratchable for 24 h.', loading: '…', scratch: 'scratch!', progress: '{p}% scratched',
    done: 'poof. secret unlocked.', replyT: 'Reply to @{n} with a secret of your own.', reply: 'reply', get: 'get sweetin',
    gone: 'already scratched.', goneSub: 'On Sweetin, a secret gets read once, then it’s gone. Send yours!',
    expired: 'too late.', expiredSub: 'This secret expired or was already erased.', notfound: 'link not found.', error: 'Something broke. Try again?',
    strip: 'a secret is waiting', from: 'from @{n}', report: 'Report this content', rules: 'Terms', privacy: 'Privacy', reveal: 'Reveal the message',
    lock: 'top secret', copied: 'Link copied: paste it in the app after installing.'
  };
  if (!fr) document.documentElement.lang = 'en';
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (s, v) { return s.replace(/\{(\w+)\}/g, function (_, k) { return v[k]; }); };
  var store = /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'https://apps.apple.com/app/idAPP_STORE_ID'
    : /Android/.test(navigator.userAgent) ? 'https://play.google.com/store/apps/details?id=app.sweetin.android' : '/';
  var sender = null, kind = 'single', mode = 'free', state = 'peek';

  $('title').textContent = T.title; $('sub').textContent = T.sub; $('strip').textContent = T.strip; $('lockT').textContent = T.lock;
  $('revealA11y').textContent = T.reveal;
  $('note').innerHTML = '<a href="mailto:team@sweetin.app?subject=Signalement&body=' + encodeURIComponent(location.href) + '">' + T.report + '</a> · <a href="' + (fr ? '/conditions/' : '/en/terms/') + '">' + T.rules + '</a> · <a href="' + (fr ? '/confidentialite/' : '/en/privacy/') + '">' + T.privacy + '</a>';

  function call(name, body) {
    return fetch(API + '/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'error'); e.code = j.code; throw e; } return j; }); });
  }

  function fail(e) {
    state = 'error';
    var code = e && e.code;
    $('title').textContent = code === 'ALREADY_OPENED' ? T.gone : code === 'NOT_FOUND' ? T.notfound : code === 'EXPIRED' ? T.expired : T.error;
    $('sub').textContent = code === 'ALREADY_OPENED' ? T.goneSub : code === 'EXPIRED' ? T.expiredSub : '';
    $('lock').hidden = false; $('lockT').textContent = '🍦';
    setCta(T.get, store);
  }

  function setCta(label, href) { var c = $('cta'); c.textContent = label; c.href = href || '#'; }

  // 1. aperçu, sans consommer le lien
  if (!token) fail({ code: 'NOT_FOUND' });
  else call('open-link', { token: token, peek: true }).then(function (p) {
    sender = p.sender; kind = p.kind; mode = p.mode;
    $('title').textContent = fmt(T.titleFrom, { n: sender });
    if (p.preview) { $('preview').src = 'data:image/jpeg;base64,' + p.preview; $('preview').hidden = false; }
    $('meta').textContent = kind === 'story' ? T.story : (mode === 'once' ? T.onceMode : T.once);
    setCta(T.open);
  }).catch(fail);
  setCta(T.loading);

  // 2. ouverture : seulement sur action de la personne
  $('cta').addEventListener('click', function (ev) {
    if (state === 'peek' || state === 'opening') {
      ev.preventDefault();
      if (state === 'opening') return;
      state = 'opening'; setCta(T.loading);
      call('open-link', { token: token }).then(start).catch(fail);
    } else if (state === 'done') {
      // garde le lien d'invitation pour l'app (collé à l'inscription) puis va vers le store ou l'app
      try { navigator.clipboard && navigator.clipboard.writeText(location.origin + '/u/' + encodeURIComponent(sender)); } catch (e) {}
    }
  });

  var canvas = $('scratch'), ctx, W, H, dpr, img, grid, covered = 0, COLS = 24, ROWS = 32, startedAt = 0, revealed = false, last = null, strokes = 0;
  var REVEAL = 62;

  function start(f) {
    sender = f.sender; mode = f.mode; kind = f.kind;
    $('msg').textContent = f.message;
    $('strip').textContent = fmt(T.from, { n: sender });
    img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = function () {
      $('backimg').src = f.photo_url;
      $('back').hidden = false; $('preview').hidden = true; $('lock').hidden = true;
      setup(); state = 'scratching';
      $('card').classList.add('live');
      $('cta').hidden = true; $('ghost').hidden = false;
      $('meta').textContent = mode === 'once' ? T.onceMode : T.scratch;
      $('revealA11y').hidden = false; $('after').hidden = false;
    };
    img.onerror = function () { fail({ code: 'EXPIRED' }); };
    img.src = f.photo_url;
  }

  function setup() {
    var r = $('photo').getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3); W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.hidden = false;
    ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    // photo en « cover »
    var s = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = W * 0.2;
    grid = new Uint8Array(COLS * ROWS);
  }

  function mark(x, y) {
    var r = W * 0.1, cw = W / COLS, ch = H / ROWS;
    for (var row = Math.max(0, Math.floor((y - r) / ch)); row <= Math.min(ROWS - 1, Math.floor((y + r) / ch)); row++)
      for (var col = Math.max(0, Math.floor((x - r) / cw)); col <= Math.min(COLS - 1, Math.floor((x + r) / cw)); col++) {
        var cx = (col + .5) * cw, cy = (row + .5) * ch;
        if ((cx - x) * (cx - x) + (cy - y) * (cy - y) <= r * r && !grid[row * COLS + col]) { grid[row * COLS + col] = 1; covered++; }
      }
  }
  var pct = function () { return Math.round(covered / (COLS * ROWS) * 100); };
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'scratching') return;
    if (mode === 'once' && strokes > 0) return;
    canvas.setPointerCapture(e.pointerId); strokes++;
    if (!startedAt) startedAt = Date.now();
    $('ghost').hidden = true;
    last = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .1, last.y); ctx.stroke(); mark(last.x, last.y);
    if (navigator.vibrate) navigator.vibrate(8);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!last || state !== 'scratching') return;
    var p = pos(e), d = Math.hypot(p.x - last.x, p.y - last.y), n = Math.max(1, Math.ceil(d / (W * 0.05)));
    for (var i = 1; i <= n; i++) mark(last.x + (p.x - last.x) * i / n, last.y + (p.y - last.y) * i / n);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    $('meta').textContent = fmt(T.progress, { p: pct() });
    if (mode === 'free' && pct() >= REVEAL) reveal();
  });
  function up() { if (!last) return; last = null; if (state === 'scratching' && (mode === 'once' || pct() >= REVEAL)) reveal(); }
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  $('revealA11y').addEventListener('click', function () { if (state === 'scratching') { covered = COLS * ROWS; reveal(); } });

  function reveal() {
    if (revealed) return; revealed = true; state = 'done';
    var p = pct(), ms = startedAt ? Date.now() - startedAt : 0;
    canvas.style.transition = 'opacity .45s'; canvas.style.opacity = '0';
    $('card').classList.add('revealed'); $('revealA11y').hidden = true;
    if (navigator.vibrate) navigator.vibrate([12, 40, 20]);
    $('title').textContent = T.done; $('sub').textContent = '';
    $('meta').textContent = '';
    $('afterT').textContent = fmt(T.replyT, { n: sender });
    setCta(T.reply + ' 🍦', '/u/' + encodeURIComponent(sender) + '?src=' + (kind === 'story' ? 'story' : 'flip'));
    $('cta').hidden = false;
    confetti();
    call('link-scratched', { token: token, percent: p, duration_ms: ms }).catch(function () {});
  }

  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c = $('confetti'), g = c.getContext('2d'), k = Math.min(window.devicePixelRatio || 1, 2);
    c.width = innerWidth * k; c.height = innerHeight * k; g.scale(k, k);
    var cols = ['#C5EE6A', '#FF8FB8', '#FFF1A8', '#BDEBFF', '#D5C6FF', '#FFF4E6'], ps = [], r = $('card').getBoundingClientRect();
    for (var i = 0; i < 90; i++) { var a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 6;
      ps.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 3 + Math.random() * 4, c: cols[i % 4], r: Math.random() * 6 }); }
    var t0 = performance.now();
    (function frame(t) {
      var age = (t - t0) / 1600; g.clearRect(0, 0, innerWidth, innerHeight);
      if (age > 1) return;
      ps.forEach(function (p) { p.vy += .18; p.x += p.vx; p.y += p.vy; p.r += .2; g.globalAlpha = 1 - age; g.fillStyle = p.c;
        g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
      requestAnimationFrame(frame);
    })(t0);
  }
})();
</script>
