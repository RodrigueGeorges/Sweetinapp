</main>

<a class="cta" id="cta" href="#" role="button">…</a>

<script src="/waitlist.js"></script>
<script>
(function () {
  'use strict';
  var API = (document.querySelector('meta[name="sweetin-api"]') || {}).content || '';
  var token = (location.pathname.split('/f/')[1] || '').split(/[/?#]/)[0];
  var fr = /^fr\b/i.test(navigator.language || 'fr');
  var MELT_S = 10;
  // même voix que l'app : minuscules, sweet / mot / gratter / lu / fondu ; jamais « secret » ni « message »
  var T = fr ? {
    title: 'quelqu’un t’a caché un mot.', titleFrom: '@{n} t’a caché un mot.', sub: 'gratte la photo du doigt pour le lire. après, il fond.',
    open: 'gratter', once: 'il ne s’ouvre qu’une fois. prends ton temps.', onceMode: 'un seul passage : ne lève pas le doigt.',
    story: 'mot posté en story, à gratter pendant 24 h.', loading: '…', scratch: 'gratte.', progress: 'continue… {p} %',
    read: 'lu.', meltsIn: 'il fond dans {s} s', melted: 'fondu.', replyT: 'réponds à @{n} avec ton propre mot.', reply: 'répondre à @{n}', get: 'télécharger sweetin',
    gone: 'déjà lu.', goneSub: 'sur sweetin, un mot se lit une fois, puis il fond. envoie le tien.',
    expired: 'trop tard.', expiredSub: 'ce mot a fondu avant que tu arrives.', notfound: 'lien introuvable.', error: 'oups. réessaie.',
    from: 'de @{n}', report: 'signaler', rules: 'conditions', privacy: 'confidentialité', noScratch: 'lire sans gratter',
    stkA: 'gratte-moi', stkB: 'mot caché', word: 'gratte.', canvas: 'photo à gratter'
  } : {
    title: 'someone hid a word for you.', titleFrom: '@{n} hid a word for you.', sub: 'scratch the photo with your finger to read it. then it melts.',
    open: 'scratch', once: 'it only opens once. take your time.', onceMode: 'one pass: don’t lift your finger.',
    story: 'word posted to a story, scratchable for 24 h.', loading: '…', scratch: 'scratch.', progress: 'keep going… {p}%',
    read: 'read.', meltsIn: 'it melts in {s} s', melted: 'melted.', replyT: 'reply to @{n} with a word of your own.', reply: 'reply to @{n}', get: 'get sweetin',
    gone: 'already read.', goneSub: 'on sweetin, a word gets read once, then it melts. send yours.',
    expired: 'too late.', expiredSub: 'this word melted before you got here.', notfound: 'link not found.', error: 'oops. try again.',
    from: 'from @{n}', report: 'report', rules: 'terms', privacy: 'privacy', noScratch: 'read without scratching',
    stkA: 'scratch me', stkB: 'hidden word', word: 'scratch.', canvas: 'photo to scratch'
  };
  if (!fr) document.documentElement.lang = 'en';
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (s, v) { return s.replace(/\{(\w+)\}/g, function (_, k) { return v[k]; }); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var store = /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'https://apps.apple.com/app/idAPP_STORE_ID'
    : /Android/.test(navigator.userAgent) ? 'https://play.google.com/store/apps/details?id=app.sweetin.android' : '/';
  var sender = null, kind = 'single', mode = 'free', state = 'peek';

  $('title').textContent = T.title; $('sub').textContent = T.sub; $('stkA').textContent = T.stkA; $('stkB').textContent = T.stkB;
  $('word').textContent = T.word; $('noscratch').textContent = T.noScratch; $('scratch').setAttribute('aria-label', T.canvas);
  $('note').innerHTML = '<a href="mailto:team@sweetin.app?subject=Signalement&body=' + encodeURIComponent(location.href) + '">' + T.report + '</a> · <a href="' + (fr ? '/conditions/' : '/en/terms/') + '">' + T.rules + '</a> · <a href="' + (fr ? '/confidentialite/' : '/en/privacy/') + '">' + T.privacy + '</a>';

  function call(name, body) {
    return fetch(API + '/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'error'); e.code = j.code; throw e; } return j; }); });
  }
  function setCta(label, href) { var c = $('cta'); c.textContent = label; c.href = href || '#'; }

  // plus de carte : la glace est tombée (mot fondu, lien déjà lu ou expiré)
  function puddle() {
    $('stage').hidden = true; $('flaque').removeAttribute('hidden');
    $('noscratch').hidden = true; $('meta').textContent = '';
  }

  function fail(e) {
    state = 'error';
    var code = e && e.code;
    $('title').textContent = code === 'ALREADY_OPENED' ? T.gone : code === 'NOT_FOUND' ? T.notfound : code === 'EXPIRED' ? T.expired : T.error;
    $('sub').textContent = code === 'ALREADY_OPENED' ? T.goneSub : code === 'EXPIRED' ? T.expiredSub : '';
    puddle();
    setCta(T.get, store);
    // lancement Android d'abord : sur iPhone, pas de lien vers un App Store vide, la liste d'attente à la place
    if (window.sweetinIosPending && sweetinIosPending(store)) sweetinWaitlist($('cta'), { api: API, src: 'flip', ref: sender, fr: fr });
  }

  // 1. aperçu, sans consommer le lien
  if (!token) fail({ code: 'NOT_FOUND' });
  else call('open-link', { token: token, peek: true }).then(function (p) {
    sender = p.sender; kind = p.kind; mode = p.mode;
    $('title').textContent = fmt(T.titleFrom, { n: sender });
    $('chip').textContent = fmt(T.from, { n: sender });
    if (p.preview) { $('preview').src = 'data:image/jpeg;base64,' + p.preview; $('preview').hidden = false; }
    $('meta').textContent = kind === 'story' ? T.story : (mode === 'once' ? T.onceMode : T.once);
    setCta(T.open);
  }).catch(fail);
  setCta(T.loading);

  // 2. ouverture : seulement sur action de la personne
  $('cta').addEventListener('click', function (ev) {
    if (state === 'peek' || state === 'opening') {
      ev.preventDefault();
      if (state === 'opening') return;
      state = 'opening'; setCta(T.loading);
      call('open-link', { token: token }).then(start).catch(fail);
    } else if (state === 'done') {
      // garde le lien d'invitation pour l'app (collé à l'inscription) puis va vers le store ou l'app
      try { navigator.clipboard && navigator.clipboard.writeText(location.origin + '/u/' + encodeURIComponent(sender)); } catch (e) {}
    }
  });

  var canvas = $('scratch'), ctx, W, H, dpr, img, sugarImg, grid, covered = 0, COLS = 24, ROWS = 32, startedAt = 0, revealed = false, last = null, strokes = 0;
  var REVEAL = 62;

  function start(f) {
    sender = f.sender; mode = f.mode; kind = f.kind;
    // le mot, lettre par lettre, pour pouvoir le faire fondre
    var msg = $('msg'); msg.textContent = '';
    // chaque mot reste d'un bloc (pas de coupure au milieu), chaque lettre peut couler
    var i = 0;
    f.message.split(/(\s+)/).forEach(function (part) {
      if (!part) return;
      if (/^\s+$/.test(part)) { msg.appendChild(document.createTextNode(' ')); return; }
      var w = document.createElement('b'); w.className = 'w';
      Array.from(part).forEach(function (ch) { var s = document.createElement('span'); s.textContent = ch; s.style.animationDelay = (i++ * 0.035) + 's'; w.appendChild(s); });
      msg.appendChild(w);
    });
    msg.setAttribute('aria-label', f.message);
    sugarImg = new Image(); sugarImg.src = '/sucre-givre.png';
    img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = function () {
      $('back').hidden = false; $('preview').hidden = true; $('sugar').hidden = true; $('word').hidden = true;
      setup(); state = 'scratching';
      $('cta').hidden = true; $('ghost').hidden = reduce;
      $('meta').textContent = mode === 'once' ? T.onceMode : T.scratch;
      $('noscratch').hidden = false;
    };
    img.onerror = function () { fail({ code: 'EXPIRED' }); };
    img.src = f.photo_url;
  }

  function setup() {
    var r = canvas.parentNode.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3); W = canvas.parentNode.offsetWidth; H = canvas.parentNode.offsetHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.hidden = false;
    ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    // photo en « cover », puis le sucre givré par-dessus : on gratte les deux
    var s = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, H);
    if (sugarImg.complete && sugarImg.naturalWidth) {
      ctx.globalAlpha = .55;
      for (var x = 0; x < W; x += 128) for (var y = 0; y < H; y += 128) ctx.drawImage(sugarImg, x, y, 128, 128);
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = W * 0.2;
    grid = new Uint8Array(COLS * ROWS);
  }

  function mark(x, y) {
    var r = W * 0.1, cw = W / COLS, ch = H / ROWS;
    for (var row = Math.max(0, Math.floor((y - r) / ch)); row <= Math.min(ROWS - 1, Math.floor((y + r) / ch)); row++)
      for (var col = Math.max(0, Math.floor((x - r) / cw)); col <= Math.min(COLS - 1, Math.floor((x + r) / cw)); col++) {
        var cx = (col + .5) * cw, cy = (row + .5) * ch;
        if ((cx - x) * (cx - x) + (cy - y) * (cy - y) <= r * r && !grid[row * COLS + col]) { grid[row * COLS + col] = 1; covered++; }
      }
  }
  var pct = function () { return Math.round(covered / (COLS * ROWS) * 100); };
  // la carte est penchée de 2° : on redresse le point touché
  function pos(e) {
    var r = canvas.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, a = 2 * Math.PI / 180;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    return { x: W / 2 + dx * Math.cos(a) - dy * Math.sin(a), y: H / 2 + dx * Math.sin(a) + dy * Math.cos(a) };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'scratching') return;
    if (mode === 'once' && strokes > 0) return;
    canvas.setPointerCapture(e.pointerId); strokes++;
    if (!startedAt) startedAt = Date.now();
    $('ghost').hidden = true; $('noscratch').hidden = true;
    last = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .1, last.y); ctx.stroke(); mark(last.x, last.y);
    if (navigator.vibrate) navigator.vibrate(8);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!last || state !== 'scratching') return;
    var p = pos(e), d = Math.hypot(p.x - last.x, p.y - last.y), n = Math.max(1, Math.ceil(d / (W * 0.05)));
    for (var i = 1; i <= n; i++) mark(last.x + (p.x - last.x) * i / n, last.y + (p.y - last.y) * i / n);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    $('meta').textContent = fmt(T.progress, { p: Math.min(100, pct() * 2) });
    if (mode === 'free' && pct() >= REVEAL) reveal();
  });
  function up() { if (!last) return; last = null; if (state === 'scratching' && (mode === 'once' || pct() >= REVEAL)) reveal(); }
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  $('noscratch').addEventListener('click', function () { if (state === 'scratching') { covered = COLS * ROWS; reveal(); } });

  function reveal() {
    if (revealed) return; revealed = true; state = 'done';
    var p = pct(), ms = startedAt ? Date.now() - startedAt : 0;
    canvas.style.transition = 'opacity .45s'; canvas.style.opacity = '0';
    $('stage').classList.add('revealed'); $('noscratch').hidden = true; $('ghost').hidden = true; $('dot').hidden = true; $('chip').hidden = true;
    if (navigator.vibrate) navigator.vibrate([12, 40, 20]);
    $('title').textContent = T.read; $('sub').textContent = '';
    setCta(fmt(T.reply, { n: sender }), '/u/' + encodeURIComponent(sender) + '?src=' + (kind === 'story' ? 'story' : 'flip'));
    $('cta').hidden = false;
    confetti();
    call('link-scratched', { token: token, percent: p, duration_ms: ms }).catch(function () {});
    // lu quelques secondes, puis il fond : les lettres coulent, puis la glace tombe
    var left = MELT_S, meta = $('meta');
    meta.innerHTML = '<span id="left"></span><span class="bar-melt"><i id="fill"></i></span>';
    var tick = function () { $('left').textContent = fmt(T.meltsIn, { s: left }); $('fill').style.width = (left / MELT_S * 100) + '%'; };
    tick();
    var iv = setInterval(function () {
      left--; tick();
      if (left > 0) return;
      clearInterval(iv);
      if (navigator.vibrate) navigator.vibrate([30, 60, 30]);
      $('stage').classList.add('melting');
      setTimeout(function () {
        $('title').textContent = T.melted; $('sub').textContent = fmt(T.replyT, { n: sender });
        puddle();
      }, reduce ? 450 : 1500);
    }, 1000);
  }

  function confetti() {
    if (reduce) return;
    var c = $('confetti'), g = c.getContext('2d'), k = Math.min(window.devicePixelRatio || 1, 2);
    c.width = innerWidth * k; c.height = innerHeight * k; g.scale(k, k);
    // les éclats de la marque : framboise, citron, sucre, nuit
    var cols = ['#FF2E5B', '#E8FF5A', '#FFE6EB', '#160F12'], ps = [], r = $('card').getBoundingClientRect();
    for (var i = 0; i < 90; i++) { var a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 6;
      ps.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 3 + Math.random() * 4, c: cols[i % 4], r: Math.random() * 6 }); }
    var t0 = performance.now();
    (function frame(t) {
      var age = (t - t0) / 1600; g.clearRect(0, 0, innerWidth, innerHeight);
      if (age > 1) return;
      ps.forEach(function (p) { p.vy += .18; p.x += p.vx; p.y += p.vy; p.r += .2; g.globalAlpha = 1 - age; g.fillStyle = p.c;
        g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
      requestAnimationFrame(frame);
    })(t0);
  }
})();
</script>
